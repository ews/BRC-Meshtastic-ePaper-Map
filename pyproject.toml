[project]
name = "brc-meshtastic-epaper-map"
version = "1.0.0"
description = "Real-time GPS tracking for Burning Man using Meshtastic mesh networks and WaveShare ePaper"
requires-python = ">=3.9"
dependencies = [
  "geographiclib>=2.0",
  "geopy>=2.3.0",
  "meshtastic>=2.1.8",
  "numpy>=1.25.0",
  "Pillow>=8.4.0",
  "protobuf>=4.23.0",
  "pygatt>=4.0.5",
  "PyQRCode>=1.2.1",
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pi = ["RPi.GPIO>=0.7.0", "spidev>=3.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*.py"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["waveshare_epd/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
