# BRC Meshtastic ePaper Map — User Configuration
# Edit this file, not config.py

# --- Display ---
display:
  width: 480
  height: 800

# --- Polling ---
sleep_seconds: 60

# --- Map Image ---
# Map file (in media/ directory)
map_file: "media/Map_resized.png"
# Where the map is pasted on the screen (top-left corner)
image_position: [0, 443]

# --- GPS → Screen Calibration ---
# Provide 2+ anchor points: [lat, lon, screen_x, screen_y]
# The first anchor is the origin (typically The Man).
# The second defines scale and rotation (pick a well-separated point like Temple or a G plaza).
# All pixel coordinates are relative to the SCREEN (not the map image).
anchors:
  - [40.783247, -119.207884, 240, 622] # The Man (centered — calibrate!)
  - [40.788099, -119.201500, 265, 599] # The Temple (approximate — calibrate!)

# Approximate feet per degree of latitude (used for GPS→feet conversion)
feet_per_degree: 364000

# --- BRC City Geometry (for BRC address display, not screen mapping) ---
brc:
  # The Man coordinates
  man_lat: 40.783247
  man_long: -119.207884

  # Distance from Man to Esplanade (feet)
  distance_man_esplanade: 2500

  # Street widths from Esplanade outward (Esplanade, A, B, C, D, E, F, G, H, I, J, K)
  distance_streets: [400, 250, 250, 250, 250, 250, 450, 250, 250, 250, 150, 150]

  # Street name letters (Esplanade + A through this letter)
  street_last_letter: "K"

  # BRC noon offset (hours) — 1.5 means geographic noon = BRC 10:30
  brc_noon: 1.5

# --- Behavior ---
# Minimum distance (feet) a node must move to trigger a screen refresh
min_distance_refresh_ft: 50

# --- Friend Filtering ---
friends_file: "friends.json"
friend_server_port: 8051

# --- Logging ---
log_file: "burners.log"

# --- Points of Interest ---
points_of_interest:
  Temple:
    clock: "12:00"
    distance_from_man_ft: 2500
  "Center Camp":
    clock: "6:00"
    distance_from_man_ft: 3027
  "The Man":
    clock: "12:00"
    distance_from_man_ft: 0

poi_radius_ft: 50

# --- Trash Fence (for debug pentagon drawing, screen pixels from Man) ---
# Distance from Man to trash fence (feet)
distance_man_to_trashfence_ft: 8479
# Pixel radius of the trash fence pentagon (will be auto-computed if not set)
trash_fence_radius_px: 332
